# The lake: object storage plus an Iceberg REST catalog, and nothing else.
#
# Two containers, deliberately. The vendor's own Lakekeeper compose adds Keycloak
# and Postgres, which is the right stack for a cluster and the wrong one for a
# booth: every extra container is another thing that can fail to come up on a
# conference floor.
#
# PORTS are offset (19000/19001/18181) so this cannot collide with anything else
# already running on the machine. Host bindings: the S3 API and the catalog on the
# Exasol VM bridge (192.168.64.1) and loopback; the MinIO console on loopback only.
# Nothing is published on 0.0.0.0. Start the Exasol VM first so 192.168.64.1 exists.
#
# Credentials come from lake/.env (git-ignored; see lake/.env.example).
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ct-lake-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in lake/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in lake/.env}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"       # S3 API, host (loader)
      - "192.168.64.1:19000:9000"    # S3 API, Exasol VM
      - "127.0.0.1:19001:9001"       # web console, host only
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ct-lake-minio-init
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket ready'"
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: ct-lake-catalog
    depends_on:
      minio: {condition: service_healthy}
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:18181:8181"       # catalog, host (loader)
      - "192.168.64.1:18181:8181"    # catalog, Exasol VM
    restart: unless-stopped

volumes:
  minio-data:
